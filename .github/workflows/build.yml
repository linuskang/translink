name: Build And Publish Images

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: app
                      context: .
                      file: apps/web/Dockerfile
                    - target: api
                      context: apps/api
                      file: apps/api/Dockerfile
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Validate web build secrets
              if: matrix.target == 'app' && github.event_name != 'pull_request'
              env:
                  NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
              run: |
                  if [ -z "$NEXT_PUBLIC_MAPTILER_KEY" ]; then
                    echo "::error::Repository secret NEXT_PUBLIC_MAPTILER_KEY is not configured"
                    exit 1
                  fi

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.target }}
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: ${{ matrix.target == 'app' && format('NEXT_PUBLIC_MAPTILER_KEY={0}', secrets.NEXT_PUBLIC_MAPTILER_KEY) || '' }}
                  cache-from: type=gha,scope=${{ matrix.target }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.target }}
